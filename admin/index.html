<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8"/>
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <title>Admin Login</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

  <!-- Background -->

  <div class="background"></div>

  <!-- Login Box -->

  <div class="login-container">

    <div class="login-box">

      <h1>HARYANA SUPPLEMENTS</h1>

      <p>Owner / Admin Login</p>

      <div class="input-box">

        <i class="fa-solid fa-envelope"></i>

        <input type="email"
        id="email"
        placeholder="Enter Email">

      </div>

      <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input type="password"
        id="password"
        placeholder="Enter Password">

      </div>

      <button id="loginBtn">
        Login
      </button>

      <p class="demo">

        OWNER LOGIN <br><br>

        Email:
        owner@haryanasupplements.com

        <br><br>

        Password:
        owner123

      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
